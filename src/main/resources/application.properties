spring.servlet.multipart.max-file-size=20GB
spring.servlet.multipart.max-request-size=20GB
spring.servlet.multipart.file-size-threshold=2MB

# The packaged Vite frontend is rebuilt frequently during local development.
# Never let the browser reuse stale static resources from an older JAR build.
spring.web.resources.cache.cachecontrol.no-store=true
