name: Temporary Javadoc generation

on:
  push:
    branches: [work]

permissions:
  contents: write

jobs:
  document:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add English Javadoc with token-level code verification
        shell: bash
        run: |
          python3 -m pip install --quiet tree_sitter tree_sitter_java
          curl -fsSL https://raw.githubusercontent.com/romansen47/chess/6cc2579a9a4daf33f72151a65580b037bf753d2c/.github/workflows/tmp-add-javadocs.yml > /tmp/source-workflow.yml
          awk '/^          from pathlib import Path$/{flag=1} /^          PY$/{flag=0} flag{sub(/^          /,""); print}' /tmp/source-workflow.yml > /tmp/add_javadocs.py
          python3 /tmp/add_javadocs.py
      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Add English Javadoc to Java methods'
          git push origin work
