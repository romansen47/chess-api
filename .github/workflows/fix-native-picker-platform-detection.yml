name: Fix native picker platform detection

on:
  push:
    branches:
      - fix/native-engine-picker

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/native-engine-picker
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Fix Darwin/Windows detection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main/java/demo/chess/api/service/NativeEngineFilePickerService.java')
          text = path.read_text()
          old = '''        if (normalizedOsName.contains("win")) {
            return DesktopPlatform.WINDOWS;
        }
        if (normalizedOsName.contains("mac") || normalizedOsName.contains("darwin")) {
            return DesktopPlatform.MACOS;
        }
'''
          new = '''        if (normalizedOsName.startsWith("mac") || normalizedOsName.contains("darwin")) {
            return DesktopPlatform.MACOS;
        }
        if (normalizedOsName.startsWith("windows")) {
            return DesktopPlatform.WINDOWS;
        }
'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one platform-detection block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Run native picker tests
        run: mvn -Dtest=NativeEngineFilePickerServiceTest test

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/fix-native-picker-platform-detection.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/demo/chess/api/service/NativeEngineFilePickerService.java .github/workflows/fix-native-picker-platform-detection.yml
          git commit -m "Fix macOS platform detection"
          git push origin HEAD:fix/native-engine-picker
